version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_campus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smart_campus_pgdata:/var/lib/postgresql/data

volumes:
  smart_campus_pgdata:
